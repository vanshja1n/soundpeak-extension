<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 280px;
      padding: 18px 16px 16px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FFFDF8;
      color: #333;
    }

    /* ── Header ────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .header img {
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 16px;
      font-weight: 800;
      color: #111111;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .header-text .tagline {
      font-size: 9px;
      font-weight: 500;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      line-height: 1;
      margin-top: 2px;
    }

    /* ── Volume display ───────────────────── */
    .volume-display {
      text-align: center;
      margin-bottom: 14px;
    }

    .volume-value {
      font-size: 42px;
      font-weight: 900;
      color: #FF7A00;
      line-height: 1;
      letter-spacing: -1px;
    }

    .volume-value.boosted {
      color: #F4511E;
    }

    .volume-label {
      font-size: 10px;
      font-weight: 600;
      color: #bbb;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 4px;
    }

    /* ── Slider ────────────────────────────── */
    .slider-container {
      margin-bottom: 16px;
      padding: 0 2px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(to right, #FFC107 0%, #FF7A00 50%, #F4511E 100%);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 2.5px solid #FF7A00;
      box-shadow: 0 1px 4px rgba(0,0,0,0.18), 0 0 0 1px rgba(255,122,0,0.08);
      cursor: pointer;
      transition: box-shadow 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      box-shadow: 0 2px 8px rgba(255,122,0,0.35), 0 0 0 1px rgba(255,122,0,0.12);
    }

    /* ── Presets ───────────────────────────── */
    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .preset-btn {
      padding: 7px 0;
      border: 1.5px solid #e8e5e0;
      border-radius: 8px;
      background: #fff;
      color: #666;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .preset-btn:hover {
      background: #FFF8EE;
      border-color: #FFB74D;
      color: #333;
    }

    .preset-btn.active {
      background: linear-gradient(135deg, #FF7A00, #F4511E);
      border-color: transparent;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(255,122,0,0.3);
    }

    /* ── Reset button ─────────────────────── */
    .reset-btn {
      display: block;
      width: 100%;
      padding: 8px;
      border: 1.5px solid #e8e5e0;
      border-radius: 8px;
      background: #fff;
      color: #888;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .reset-btn:hover {
      background: #f5f3f0;
      border-color: #d5d0ca;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="logo.png" alt="SoundPeak" width="28" height="28" style="border-radius: 6px;">
    <div class="header-text">
      <h1>SoundPeak</h1>
      <div class="tagline">Volume Booster & Audio Enhancer</div>
    </div>
  </div>

  <div class="volume-display">
    <div class="volume-value" id="volumeValue">100%</div>
    <div class="volume-label">volume level</div>
  </div>

  <div class="slider-container">
    <input type="range" id="volumeSlider" min="0" max="600" value="100" step="5">
  </div>

  <div class="presets">
    <button class="preset-btn" data-gain="100">100%</button>
    <button class="preset-btn" data-gain="200">200%</button>
    <button class="preset-btn" data-gain="400">400%</button>
    <button class="preset-btn" data-gain="600">600%</button>
  </div>

  <button class="reset-btn" id="resetBtn">Reset to Normal</button>

  <div id="statusMsg" style="display:none;margin-top:10px;padding:6px 8px;border-radius:5px;font-size:11px;text-align:center;"></div>

  <script src="popup.js"></script>
</body>
</html>
